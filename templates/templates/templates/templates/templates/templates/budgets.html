{% extends "base.html" %}
{% block content %}
<h2>Budgets</h2>
<form method="POST">
  <input name="category" placeholder="Category" required>
  <input type="number" name="budget" placeholder="Monthly Budget" required>
  <button>Save</button>
</form>
<table>
<tr><th>Category</th><th>Budget</th><th>Spent</th><th>Status</th></tr>
{% for r in rows %}
<tr>
<td>{{r.category}}</td>
<td>₱{{r.monthly_budget}}</td>
<td>₱{{r.spent}}</td>
<td>
{% if r.spent > r.monthly_budget %}<b style="color:red">Over</b>
{% elif r.spent >= r.monthly_budget*0.8 %}<b style="color:orange">Near</b>
{% else %}<b style="color:green">OK</b>{% endif %}
</td>
</tr>
{% endfor %}
</table>
{% endblock %}
